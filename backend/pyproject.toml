[project]
name = "bank-policy-copilot"
version = "0.1.0"
description = "Ask what the bank's policies said on any date, with the paragraph, only from what you may read."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "snowballstemmer>=2.2",
  "pydantic-settings>=2.4",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
sim = ["reportlab>=4.2", "scikit-learn>=1.5"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "reportlab>=4.2", "scikit-learn>=1.5"]

[project.scripts]
copilot = "copilot.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copilot = ["migrations/*.sql"]
copilot_sim = ["blind/*.json", "blind/*.md", "blind/corpus/*.md", "regression/*/*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # long lines are strings; ruff format wraps code

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src/copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs PostgreSQL with pgvector (COPILOT_TEST_DATABASE_URL)"]
