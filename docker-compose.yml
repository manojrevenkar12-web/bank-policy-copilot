# Local stack: Postgres with pgvector, the API, the web app, and a one-off seed of the simulated bank.
#   docker compose up -d --build
#   docker compose --profile demo run --rm seed
# then open http://localhost:8080
name: bank-policy-copilot

x-env: &env
  COPILOT_DATABASE_URL: postgresql://copilot_app:${APP_DB_PASSWORD:-copilot_app}@postgres:5432/copilot
  COPILOT_ADMIN_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/copilot
  COPILOT_APP_DB_PASSWORD: ${APP_DB_PASSWORD:-copilot_app}
  COPILOT_TOKEN_SECRET: ${TOKEN_SECRET:-compose-only-secret-at-least-32-characters}
  COPILOT_DEMO_MODE: ${DEMO_MODE:-true}
  COPILOT_CORS_ORIGIN: http://localhost:8080
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilot"]
      interval: 2s
      retries: 30

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    environment: *env
    command: ["copilot", "migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    environment: *env
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    environment:
      API_UPSTREAM: http://api:8000
    ports: ["8080:8080"]
    depends_on: [api]

  seed:
    profiles: [demo]
    build: { context: ., dockerfile: backend/Dockerfile, target: tools }
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:
